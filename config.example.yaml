# IPP Sharing configuration
#
# This file is read from the directory containing the executable, unless a
# different path is given with --config.
#
#   ipp-sharing-gui.exe --config D:\ipp-sharing\config.yaml
#   ipp-sharing.exe     --config D:\ipp-sharing\config.yaml

server:
  addr:
    - "[::]:631"
    - "0.0.0.0:631"
  # Optional. Defaults to "<hostname>.local:631".
  # If you use a self-signed certificate, set this to a name the client can
  # resolve AND that is covered by the certificate, otherwise clients will
  # reject the TLS connection.
  # host: "my-pc.local:631"

  # TLS is OFF by default: the block below points at paths that do not exist
  # until you create them, and enabling it unconditionally made the shipped
  # installer's first run fail to start.
  #
  # To enable HTTPS, generate a self-signed pair:
  #   openssl req -x509 -newkey rsa:4096 -keyout key.pem -out certificate.pem -days 365 -nodes
  # then uncomment this block and point it at the real files.
  #
  # tls:
  #   cert: "C:/ipp-sharing/certificate.pem"
  #   key: "C:/ipp-sharing/key.pem"

devices:
  - name: "Print To PDF (IppSharing)"
    info: "Print To PDF (IppSharing)"
    # Must match a printer name installed on this machine exactly, as shown in
    # Settings > Bluetooth & devices > Printers & scanners.
    target: "Microsoft Print to PDF"
    # Unique per printer. Generate a fresh one at https://www.uuidgenerator.net/
    uuid: "b27599fd-800c-409e-afe9-6dbbe11689ac"
    basepath: "/ipp/to_pdf"
    # Requires Apple Bonjour for automatic discovery.
    dnssd: true
