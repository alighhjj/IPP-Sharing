name: Build

on:
  push:
    branches: ["main", "master"]
    paths-ignore:
      - "**/*.md"
      - "LICENSE.md"
      - ".gitignore"
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback: formatting, lints and compile-checked tests, without waiting
  # for a Windows runner.
  #
  # This crate is Windows-only (winprint pulls in the Win32 printing APIs), so
  # it cannot be built for a Linux target at all. The checks below therefore
  # target x86_64-pc-windows-gnu rather than the MSVC target: `ring`, pulled in
  # via rustls for IPP-over-TLS, compiles C code at build time and needs
  # lib.exe, which only exists in the MSVC toolchain on Windows. The GNU target
  # uses mingw-w64, which is installable here — so this job stays fast and the
  # actual MSVC build happens on windows-latest below.
  lint:
    name: Lint & Test
    runs-on: ubuntu-latest
    env:
      TARGET: x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
          components: rustfmt, clippy

      - name: Install mingw-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64

      - name: Configure the cross linker
        # Appended rather than committed to .cargo/config.toml so that the
        # real MSVC build on Windows is unaffected.
        run: |
          cat >> .cargo/config.toml <<'EOF'

          [target.x86_64-pc-windows-gnu]
          linker = "x86_64-w64-mingw32-gcc"
          ar = "x86_64-w64-mingw32-ar"
          EOF

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked --target $TARGET -- -D warnings

      - name: Compile tests
        run: cargo test --workspace --no-run --locked --target $TARGET

  build:
    name: Build (${{ matrix.arch }})
    needs: lint
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-pc-windows-msvc
          - arch: x86
            target: i686-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked --target ${{ matrix.target }} -- -D warnings

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} --workspace
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"

      - name: Smoke test (CLI --version)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $release = "target/${{ matrix.target }}/release"

          # pdfium.dll is a runtime dependency of the pdfium feature and lives
          # in a build-script OUT_DIR; copy it next to the binaries before
          # running them, otherwise the process dies with STATUS_DLL_NOT_FOUND.
          $pdfium = Get-ChildItem "$release/build" -Recurse -Filter pdfium.dll -File -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if ($pdfium) {
            Copy-Item $pdfium.FullName $release -Force
          } else {
            Write-Warning "pdfium.dll not found; relying on winpdf feature"
          }

          $version = & "$release/ipp-sharing.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "CLI exited with $LASTEXITCODE" }
          Write-Host "OK: $version"

      - name: Stage artifacts
        shell: pwsh
        # Reuses the release packaging script so the workflow preview and the
        # published release always contain exactly the same file set.
        run: |
          $ErrorActionPreference = "Stop"
          ./.github/scripts/build-installer.ps1 `
            -Target ${{ matrix.target }} `
            -Version "0.0.0-ci" `
            -ShortSha "$("${{ github.sha }}".Substring(0,7))" `
            -SkipInstaller `
            -OutputDir (Join-Path $PWD "dist/${{ matrix.arch }}")

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipp-sharing-${{ matrix.arch }}-windows
          path: dist/${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 14
